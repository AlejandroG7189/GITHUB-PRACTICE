{% extends "base.html" %}

{% block content %}
<div class="login-wrapper">
    <div class="card login-card">
        <h2 class="text-center">Iniciar Sesión</h2>
        <p class="text-subtitle">Acceso al panel de administración de usuarios</p>

        <form action="{{ url_for('login') }}" method="POST" class="form-group">
            <div class="form-control">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autofocus>
            </div>

            <div class="form-control">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </form>

        <div class="login-credentials-hint">
            <small><strong>Credenciales por defecto:</strong></small><br>
            <small>Usuario: <code>admin</code> | Contraseña: <code>1234</code></small>
        </div>
    </div>
</div>
{% endblock %}
